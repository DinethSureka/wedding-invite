<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amara & Rohan — 14 February 2027</title>
<meta property="og:title" content="Amara & Rohan — you're invited">
<meta property="og:description" content="14 February 2027 · Bellwood House">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141B22;
    --ink-2:#1C252E;
    --pearl:#F2EEE8;
    --pearl-dim:#A9A69F;
    --brass:#C0A16B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    background-image:radial-gradient(120% 80% at 50% 0%, var(--ink-2) 0%, var(--ink) 62%);
    color:var(--pearl);
    font-family:'Jost',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100svh;padding:clamp(24px,6vw,64px);
    -webkit-font-smoothing:antialiased;
  }
  .card{width:min(560px,100%);text-align:center;position:relative}

  .eyebrow{
    font-size:clamp(9px,2.4vw,11px);letter-spacing:.42em;text-transform:uppercase;
    color:var(--pearl-dim);font-weight:300;
  }

  .names{
    font-family:'Cormorant',Georgia,serif;font-weight:300;
    font-size:clamp(46px,13vw,86px);line-height:1.04;
    margin:clamp(20px,5vw,30px) 0;
  }
  .names .amp{
    display:block;font-style:italic;color:var(--brass);
    font-size:.42em;margin:.16em 0;
  }
  /* letters fade up one by one */
  .ltr{display:inline-block;opacity:0;transform:translateY(.35em);
    animation:rise .9s cubic-bezier(.2,.7,.3,1) forwards;}
  @keyframes rise{to{opacity:1;transform:none}}

  .rule{
    width:0;height:1px;background:var(--brass);margin:0 auto;
    animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards;
  }
  @keyframes draw{to{width:min(180px,45%)}}

  .date{
    font-family:'Cormorant',Georgia,serif;font-size:clamp(20px,5.2vw,28px);
    letter-spacing:.06em;margin:clamp(22px,5vw,30px) 0 6px;
  }
  .place{font-size:clamp(11px,3vw,13px);letter-spacing:.2em;text-transform:uppercase;color:var(--pearl-dim);font-weight:300}
  .detail{margin-top:clamp(26px,6vw,36px);font-size:clamp(12px,3.2vw,14px);line-height:2;color:var(--pearl-dim);font-weight:300}

  .rsvp{
    display:inline-block;margin-top:clamp(26px,6vw,34px);
    padding:13px 30px;border:1px solid rgba(192,161,107,.5);border-radius:2px;
    color:var(--pearl);text-decoration:none;
    font-size:11px;letter-spacing:.26em;text-transform:uppercase;
    transition:background .35s ease,border-color .35s ease;
  }
  .rsvp:hover,.rsvp:focus-visible{background:rgba(192,161,107,.14);border-color:var(--brass)}
  .rsvp:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

  .fade{opacity:0;animation:fade 1.1s ease forwards}
  @keyframes fade{to{opacity:1}}

  @media(prefers-reduced-motion:reduce){
    .ltr,.fade{animation:none;opacity:1;transform:none}
    .rule{animation:none;width:min(180px,45%)}
  }
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow fade" style="animation-delay:.15s">Together with their families</p>

    <h1 class="names" id="names">
      <span data-word>Amara</span>
      <span class="amp fade" style="animation-delay:1.5s">and</span>
      <span data-word>Rohan</span>
    </h1>

    <div class="rule" style="animation-delay:2.1s"></div>

    <p class="date fade" style="animation-delay:2.5s">Sunday, 14 February 2027</p>
    <p class="place fade" style="animation-delay:2.7s">Bellwood House · Goa</p>

    <p class="detail fade" style="animation-delay:2.95s">
      Ceremony at four in the afternoon<br>
      Dinner and dancing to follow
    </p>

    <a class="rsvp fade" style="animation-delay:3.2s" href="mailto:hello@example.com?subject=RSVP">RSVP</a>
  </main>

<script>
  // split the two names into letters and stagger them
  document.querySelectorAll('#names [data-word]').forEach((el, w) => {
    const text = el.textContent.trim();
    el.textContent = '';
    [...text].forEach((ch, i) => {
      const s = document.createElement('span');
      s.className = 'ltr';
      s.textContent = ch;
      s.style.animationDelay = (0.35 + w * 1.15 + i * 0.07) + 's';
      el.appendChild(s);
    });
  });
</script>
</body>
</html>
